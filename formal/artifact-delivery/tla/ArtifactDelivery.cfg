\* Clean run: full adversary (crashes, list failure/lag, uncertain HEAD, lost PUT
\* response, PUT/prepare failures) with only the invariants that HOLD.
\* The violated ones are checked one at a time by run_all.sh.
CONSTANTS
    MaxSteps = 24
    MaxFiles = 3
    MaxCrashes = 2
    EnableListFail = TRUE
    EnableListLag = TRUE
    EnableHeadUncertain = TRUE
    EnableLostResponse = TRUE
    EnablePutFail = TRUE
    EnablePrepFail = TRUE
SPECIFICATION Spec
CONSTRAINT StepBound
INVARIANTS TypeOK DedupLemma ReceiptPointsToComplete
