name: Promote immutable Windows candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: CI run containing jazz-capture-msi-unsigned
        required: true
        type: string
      release_tag:
        description: New immutable vMAJOR.MINOR.PATCH tag, already created at expected_commit
        required: true
        type: string
      expected_commit:
        description: Immutable commit resolved by the existing tag
        required: true
        type: string

permissions: {}

jobs:
  resolve-and-publish:
    # No checkout: the only write-capable job handles verified artifact bytes and GitHub metadata.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jazz-capture-msi-unsigned
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Refuse mutable identities and publish verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.candidate_run_id }}")
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$COMMIT"
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          test "$(find candidate -type f | wc -l)" = 3
          pushd candidate
          msi=(JazzCapture-*-win-x64-unsigned.msi); test "${#msi[@]}" = 1
          test -f "${msi[0]}.sha256"; test -f "${msi[0]}.manifest.json"
          sha256sum -c "${msi[0]}.sha256"
          python3 -c 'import json,sys,os,hashlib; m=json.load(open(sys.argv[1])); p=sys.argv[2]; assert m["filename"] == p and m["unsigned"] is True and m["commit"] == sys.argv[3] and str(m["workflowRun"]) == sys.argv[4] and m["version"] == sys.argv[5][1:] and m["sha256"] == hashlib.sha256(open(p,"rb").read()).hexdigest() and m["byteLength"] == os.path.getsize(p)' "${msi[0]}.manifest.json" "${msi[0]}" "$COMMIT" "${{ inputs.candidate_run_id }}" "$TAG"
          hash=$(sha256sum "${msi[0]}" | cut -d' ' -f1); length=$(stat -c%s "${msi[0]}")
          gh release create "$TAG" "${msi[0]}" "${msi[0]}.sha256" "${msi[0]}.manifest.json" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "Unsigned Windows candidate promoted without rebuilding. Commit: $COMMIT. CI run: ${{ inputs.candidate_run_id }}. Asset: ${msi[0]} ($length bytes, SHA-256 $hash). Qualify these exact draft bytes before publication."
          popd
