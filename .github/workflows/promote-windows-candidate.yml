name: Promote immutable Windows candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: CI run containing jazz-capture-msi-unsigned
        required: true
        type: string
      release_tag:
        description: New immutable vMAJOR.MINOR.PATCH tag, already created at expected_commit
        required: true
        type: string
      expected_commit:
        description: Immutable commit resolved by the existing tag
        required: true
        type: string

permissions: {}

jobs:
  resolve-and-publish:
    # No checkout: the only write-capable job handles verified artifact bytes and GitHub metadata.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jazz-capture-msi-unsigned
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Refuse mutable identities and publish verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${{ inputs.candidate_run_id }}" =~ ^[1-9][0-9]*$ ]] || exit 1
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.candidate_run_id }}")
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .event <<<"$run")" = push
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .path <<<"$run")" = .github/workflows/ci.yml
          test "$(jq -r .head_sha <<<"$run")" = "$COMMIT"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          test "$(jq -r .object.type <<<"$tag")" = tag
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$tag")")
          test "$(jq -r .object.type <<<"$tag_object")" = commit
          test "$(jq -r .object.sha <<<"$tag_object")" = "$COMMIT"
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          test "$(find candidate -type f | wc -l)" = 3
          pushd candidate
          msi="JazzCapture-${TAG#v}-win-x64-unsigned.msi"
          test -f "$msi"; test -f "$msi.sha256"; test -f "$msi.manifest.json"
          sha256sum -c "$msi.sha256"
          python3 -c 'import json,sys,os,hashlib,re; m=json.load(open(sys.argv[1])); p=sys.argv[2]; guid=r"[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}"; assert set(m)=={"schema","version","filename","byteLength","sha256","productCode","upgradeCode","packageCode","productVersion","unsigned","commit","workflowRun","workflowAttempt"} and m["schema"]==1 and m["filename"]==p and m["unsigned"] is True and m["commit"]==sys.argv[3] and m["workflowRun"]==sys.argv[4] and re.fullmatch(r"[1-9][0-9]*",m["workflowAttempt"]) and m["version"]==m["productVersion"]==sys.argv[5][1:] and re.fullmatch(guid,m["productCode"]) and re.fullmatch(guid,m["upgradeCode"]) and re.fullmatch(r"\{"+guid+r"\}",m["packageCode"]) and m["sha256"]==hashlib.sha256(open(p,"rb").read()).hexdigest() and m["byteLength"]==os.path.getsize(p)' "$msi.manifest.json" "$msi" "$COMMIT" "${{ inputs.candidate_run_id }}" "$TAG"
          hash=$(sha256sum "$msi" | cut -d' ' -f1); length=$(stat -c%s "$msi")
          product_code=$(jq -r .productCode "$msi.manifest.json"); upgrade_code=$(jq -r .upgradeCode "$msi.manifest.json"); package_code=$(jq -r .packageCode "$msi.manifest.json")
          notes=$(printf 'Unsigned Windows candidate promoted without rebuilding.\n\nCommit: `%s`\nCI run: `%s`\nAsset: `%s`\nLength: `%s` bytes\nSHA-256: `%s`\nProductCode: `%s`\nUpgradeCode: `%s`\nPackageCode: `%s`\n\nQualify these exact draft bytes before publication.' "$COMMIT" "${{ inputs.candidate_run_id }}" "$msi" "$length" "$hash" "$product_code" "$upgrade_code" "$package_code")
          gh release create "$TAG" "$msi" "$msi.sha256" "$msi.manifest.json" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --draft --title "$TAG" --notes "$notes"
          for attempt in 1 2 3 4 5; do
            if release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG") &&
               test "$(jq -r .target_commitish <<<"$release")" = "$COMMIT" &&
               test "$(jq '.assets | length' <<<"$release")" = 3; then
              break
            fi
            test "$attempt" -lt 5 || exit 1
            sleep $((attempt * 2))
          done
          popd
