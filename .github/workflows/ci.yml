name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Desktop capture contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv run --script contract/validate_schemas.py
      - run: uv run --script contract/archive/validate_archives.py
      - run: uv run --script contract/archive/container/generate_fixtures.py --check
      - run: uv run --script contract/live/validate_live_transport.py

  macos:
    name: macOS client
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v6
      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - run: swift build
      - run: swift test
