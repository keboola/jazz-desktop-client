name: Qualify Windows release MSI

run-name: Qualify ${{ inputs.release_tag }} (${{ inputs.release_state }})

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string
      release_state:
        description: Expected state of the release asset
        required: true
        type: choice
        options:
          - draft
          - published
      expected_commit:
        description: Exact 40-character merge commit
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 of the immutable MSI asset
        required: true
        type: string
      baseline_tag:
        description: Published baseline tag for upgrade qualification
        required: true
        default: v0.26.2
        type: string
      expected_baseline_sha256:
        description: Expected SHA-256 of the immutable baseline MSI
        required: true
        type: string

permissions: {}

concurrency:
  group: windows-release-qualification-${{ inputs.release_tag }}-${{ inputs.release_state }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact release asset
    runs-on: windows-latest
    timeout-minutes: 10
    # Draft releases are visible only with push-level repository access. This job never checks out
    # or runs repository code, and its inline script performs only metadata reads and one download.
    permissions:
      contents: write
    outputs:
      asset_name: ${{ steps.release.outputs.asset_name }}
      byte_length: ${{ steps.release.outputs.byte_length }}
      sha256: ${{ steps.release.outputs.sha256 }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release identity and download exact asset
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_STATE: ${{ inputs.release_state }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag.' }
          if ($env:RELEASE_STATE -notin @('draft', 'published')) { throw 'Invalid release state.' }
          if ($env:EXPECTED_COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid expected commit.' }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid expected SHA-256.' }
          $expectedCommit = $env:EXPECTED_COMMIT.ToLowerInvariant()
          $expectedSha256 = $env:EXPECTED_SHA256.ToLowerInvariant()

          # Unlike the by-tag endpoint, the authenticated release-list endpoint includes drafts.
          $releaseJson = gh api --method GET --paginate --slurp `
            "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate repository releases.' }
          $pages = @($releaseJson | ConvertFrom-Json)
          $releaseMatches = @(
            foreach ($page in $pages) {
              foreach ($candidate in @($page)) {
                if ([string]$candidate.tag_name -ceq $env:RELEASE_TAG) { $candidate }
              }
            }
          )
          if ($releaseMatches.Count -ne 1) { throw 'Expected exactly one release with the requested tag.' }
          $release = $releaseMatches[0]
          $expectDraft = $env:RELEASE_STATE -eq 'draft'
          if ([bool]$release.draft -ne $expectDraft) { throw 'Release state differs from release_state.' }
          if ([string]$release.target_commitish.ToLowerInvariant() -ne $expectedCommit) {
            throw 'Release target_commitish differs from expected_commit.'
          }

          # Resolve the immutable tag through the GitHub API. Annotated tags are dereferenced with
          # a small hard limit; the current release tags are lightweight commit refs.
          $tagRefJson = gh api --method GET `
            "repos/$($env:GITHUB_REPOSITORY)/git/ref/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the immutable release tag.' }
          $tagObject = ($tagRefJson | ConvertFrom-Json).object
          $tagDepth = 0
          while ([string]$tagObject.type -eq 'tag') {
            $tagDepth++
            if ($tagDepth -gt 4) { throw 'Annotated release tag nesting is too deep.' }
            $tagJson = gh api --method GET `
              "repos/$($env:GITHUB_REPOSITORY)/git/tags/$($tagObject.sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Could not dereference the annotated release tag.' }
            $tagObject = ($tagJson | ConvertFrom-Json).object
          }
          if ([string]$tagObject.type -ne 'commit' -or
              [string]$tagObject.sha.ToLowerInvariant() -ne $expectedCommit) {
            throw 'Release tag does not resolve to expected_commit.'
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $assetName = "JazzCapture-$version-win-x64-unsigned.msi"
          $assetMatches = @($release.assets | Where-Object { [string]$_.name -ceq $assetName })
          if ($assetMatches.Count -ne 1) { throw 'The release must contain exactly one expected MSI asset.' }
          $asset = $assetMatches[0]
          $assetId = 0L
          if (-not [long]::TryParse([string]$asset.id, [ref]$assetId) -or $assetId -le 0) {
            throw 'The release MSI asset ID is invalid.'
          }
          $expectedLength = [int64]$asset.size
          if ($expectedLength -le 0) { throw 'The release MSI asset length is invalid.' }

          $downloadDirectory = Join-Path $env:GITHUB_WORKSPACE 'resolved-release-asset'
          [void][IO.Directory]::CreateDirectory($downloadDirectory)
          $msi = Join-Path $downloadDirectory $assetName
          $headers = @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $($env:GH_TOKEN)"
            'User-Agent' = 'Jazz release qualification'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/assets/$assetId" `
            -Headers $headers `
            -OutFile $msi
          $actualLength = (Get-Item -LiteralPath $msi).Length
          $actualSha256 = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualLength -ne $expectedLength) { throw 'Downloaded MSI length differs from release metadata.' }
          if ($actualSha256 -ne $expectedSha256) { throw 'Downloaded MSI SHA-256 differs from expected_sha256.' }

          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "byte_length=$actualLength" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$actualSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload exact MSI for the read-only qualification job
        uses: actions/upload-artifact@v4
        with:
          name: resolved-release-msi-${{ github.run_id }}-${{ github.run_attempt }}
          path: resolved-release-asset/${{ steps.release.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 1

  resolve-baseline:
    name: Resolve exact published baseline asset
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      asset_name: ${{ steps.baseline.outputs.asset_name }}
      byte_length: ${{ steps.baseline.outputs.byte_length }}
      sha256: ${{ steps.baseline.outputs.sha256 }}
      version: ${{ steps.baseline.outputs.version }}
      commit: ${{ steps.baseline.outputs.commit }}
    steps:
      - name: Validate baseline tag and download exact published asset
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
          EXPECTED_SHA256: ${{ inputs.expected_baseline_sha256 }}
        run: |
          if ($env:BASELINE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid baseline tag.' }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid baseline SHA-256.' }
          $all = gh api --method GET --paginate --slurp "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate releases for baseline.' }
          $matches = @(foreach ($page in @($all)) { foreach ($item in @($page)) { if ([string]$item.tag_name -ceq $env:BASELINE_TAG) { $item } } })
          if ($matches.Count -ne 1 -or [bool]$matches[0].draft) { throw 'Baseline must resolve to exactly one published release.' }
          $release = $matches[0]
          $ref = gh api --method GET "repos/$($env:GITHUB_REPOSITORY)/git/ref/tags/$($env:BASELINE_TAG)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve baseline tag.' }
          $object = $ref.object
          for ($depth = 0; [string]$object.type -eq 'tag'; $depth++) {
            if ($depth -ge 4) { throw 'Annotated baseline tag nesting is too deep.' }
            $object = (gh api --method GET "repos/$($env:GITHUB_REPOSITORY)/git/tags/$($object.sha)" | ConvertFrom-Json).object
            if ($LASTEXITCODE -ne 0) { throw 'Could not dereference baseline tag.' }
          }
          if ([string]$object.type -ne 'commit') { throw 'Baseline tag does not resolve to a commit.' }
          $commit = [string]$object.sha.ToLowerInvariant()
          if ([string]$release.target_commitish.ToLowerInvariant() -ne $commit) { throw 'Baseline release target differs from its immutable tag commit.' }
          $version = $env:BASELINE_TAG.Substring(1)
          $name = "JazzCapture-$version-win-x64-unsigned.msi"
          $assets = @($release.assets | Where-Object { [string]$_.name -ceq $name })
          if ($assets.Count -ne 1 -or [int64]$assets[0].size -le 0) { throw 'Baseline has no unique expected MSI asset.' }
          $directory = Join-Path $env:GITHUB_WORKSPACE 'resolved-baseline-asset'
          [void][IO.Directory]::CreateDirectory($directory)
          $path = Join-Path $directory $name
          $headers = @{ Accept='application/octet-stream'; Authorization="Bearer $($env:GH_TOKEN)"; 'User-Agent'='Jazz release qualification'; 'X-GitHub-Api-Version'='2022-11-28' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/assets/$($assets[0].id)" -Headers $headers -OutFile $path
          $length = (Get-Item -LiteralPath $path).Length
          $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($length -ne [int64]$assets[0].size -or $sha -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw 'Baseline bytes differ from release metadata or expected SHA-256.' }
          "asset_name=$name" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "byte_length=$length" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$sha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit=$commit" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload exact baseline for read-only qualification
        uses: actions/upload-artifact@v4
        with:
          name: resolved-baseline-msi-${{ github.run_id }}-${{ github.run_attempt }}
          path: resolved-baseline-asset/${{ steps.baseline.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 1

  qualify:
    name: Exact release asset on clean Windows
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Download resolver-owned exact MSI
        uses: actions/download-artifact@v4
        with:
          name: resolved-release-msi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resolved-release-msi
      - name: Reverify exact MSI bytes
        id: release
        shell: pwsh
        env:
          EXPECTED_ASSET_NAME: ${{ needs.resolve.outputs.asset_name }}
          EXPECTED_BYTE_LENGTH: ${{ needs.resolve.outputs.byte_length }}
          EXPECTED_SHA256: ${{ needs.resolve.outputs.sha256 }}
        run: |
          if ($env:EXPECTED_ASSET_NAME -notmatch '^JazzCapture-[0-9]+\.[0-9]+\.[0-9]+-win-x64-unsigned\.msi$') {
            throw 'Resolver returned an invalid MSI asset name.'
          }
          if ($env:EXPECTED_BYTE_LENGTH -notmatch '^[1-9][0-9]*$') { throw 'Resolver returned an invalid MSI length.' }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Resolver returned an invalid MSI SHA-256.' }
          $download = Join-Path $env:RUNNER_TEMP 'resolved-release-msi'
          $files = @(Get-ChildItem -LiteralPath $download -File)
          if ($files.Count -ne 1 -or $files[0].Name -cne $env:EXPECTED_ASSET_NAME) {
            throw 'Internal workflow artifact does not contain exactly the expected MSI.'
          }
          $msi = $files[0].FullName
          if ($files[0].Length -ne [int64]$env:EXPECTED_BYTE_LENGTH) {
            throw 'Internal workflow artifact MSI length changed between jobs.'
          }
          $actual = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) { throw 'Internal workflow artifact MSI SHA-256 changed between jobs.' }
          "msi=$msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Test qualification helpers
        shell: pwsh
        run: ./windows/installer/tests/Test-MsiQualificationHelpers.ps1 -MsiPath '${{ steps.release.outputs.msi }}'
      - name: Prove release package contains no test-only hook
        shell: pwsh
        run: ./windows/installer/tests/Assert-ReleaseMsiSafety.ps1 -MsiPath '${{ steps.release.outputs.msi }}' -Role Candidate
      - name: Qualify downloaded release bytes
        shell: pwsh
        run: |
          ./windows/installer/tests/Invoke-MsiLifecycleQualification.ps1 `
            -MsiPath '${{ steps.release.outputs.msi }}' `
            -ExpectedVersion '${{ needs.resolve.outputs.version }}' `
            -EvidenceDirectory ./windows/installer/artifacts/release-qualification `
            -AllowInstalledProductMutation
      - name: Enforce exact-asset evidence privacy
        id: qualification_privacy
        if: always()
        shell: pwsh
        run: |
          Import-Module ./windows/installer/tests/MsiQualification.psm1 -Force
          Assert-QualificationEvidencePrivacy `
            -EvidenceDirectory ./windows/installer/artifacts/release-qualification
      - name: Upload privacy-safe exact-asset evidence
        if: ${{ always() && steps.qualification_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jazz-capture-${{ inputs.release_tag }}-${{ inputs.release_state }}-qualification
          path: windows/installer/artifacts/release-qualification/
          if-no-files-found: warn

  qualify-upgrade:
    # First launch intentionally leaves consent state under the data root, and uninstall preserves
    # it. Upgrade qualification therefore needs its own clean profile rather than deleting durable
    # user data left by the exact-release lifecycle job.
    name: Exact baseline upgrade on clean Windows
    needs: [resolve, resolve-baseline]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Download resolver-owned exact MSI
        uses: actions/download-artifact@v4
        with:
          name: resolved-release-msi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resolved-release-msi
      - name: Download resolver-owned exact baseline MSI
        uses: actions/download-artifact@v4
        with:
          name: resolved-baseline-msi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resolved-baseline-msi
      - name: Reverify exact MSI transfers
        id: packages
        shell: pwsh
        env:
          RELEASE_NAME: ${{ needs.resolve.outputs.asset_name }}
          RELEASE_LENGTH: ${{ needs.resolve.outputs.byte_length }}
          RELEASE_SHA256: ${{ needs.resolve.outputs.sha256 }}
          BASELINE_NAME: ${{ needs.resolve-baseline.outputs.asset_name }}
          BASELINE_LENGTH: ${{ needs.resolve-baseline.outputs.byte_length }}
          BASELINE_SHA256: ${{ needs.resolve-baseline.outputs.sha256 }}
        run: |
          function Resolve-ExactMsi([string]$directory, [string]$name, [int64]$length, [string]$sha256) {
            if ($name -notmatch '^JazzCapture-[0-9]+\.[0-9]+\.[0-9]+-win-x64-unsigned\.msi$' -or
                $length -le 0 -or $sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Resolver returned invalid MSI identity.' }
            $files = @(Get-ChildItem -LiteralPath $directory -File)
            if ($files.Count -ne 1 -or $files[0].Name -cne $name -or $files[0].Length -ne $length) {
              throw 'Internal workflow artifact does not contain the exact expected MSI.'
            }
            if ((Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha256) {
              throw 'Internal workflow artifact MSI SHA-256 changed between jobs.'
            }
            return $files[0].FullName
          }
          $release = Resolve-ExactMsi (Join-Path $env:RUNNER_TEMP 'resolved-release-msi') $env:RELEASE_NAME ([int64]$env:RELEASE_LENGTH) $env:RELEASE_SHA256
          $baseline = Resolve-ExactMsi (Join-Path $env:RUNNER_TEMP 'resolved-baseline-msi') $env:BASELINE_NAME ([int64]$env:BASELINE_LENGTH) $env:BASELINE_SHA256
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "baseline=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Prove both release packages contain no test-only hook
        shell: pwsh
        run: |
          ./windows/installer/tests/Assert-ReleaseMsiSafety.ps1 -MsiPath '${{ steps.packages.outputs.baseline }}' -Role Baseline
          ./windows/installer/tests/Assert-ReleaseMsiSafety.ps1 -MsiPath '${{ steps.packages.outputs.release }}' -Role Candidate
      - name: Qualify exact baseline-to-candidate upgrade bytes
        shell: pwsh
        run: |
          ./windows/installer/tests/Invoke-ReleaseUpgradeQualification.ps1 `
            -BaselineMsiPath '${{ steps.packages.outputs.baseline }}' `
            -CandidateMsiPath '${{ steps.packages.outputs.release }}' `
            -EvidenceDirectory ./windows/installer/artifacts/release-upgrade-qualification `
            -AllowInstalledProductMutation
      - name: Enforce exact upgrade evidence privacy
        id: qualification_privacy
        if: always()
        shell: pwsh
        run: |
          Import-Module ./windows/installer/tests/MsiQualification.psm1 -Force
          Assert-QualificationEvidencePrivacy -EvidenceDirectory ./windows/installer/artifacts/release-upgrade-qualification
      - name: Upload privacy-safe exact upgrade evidence
        if: ${{ always() && steps.qualification_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jazz-capture-${{ inputs.release_tag }}-${{ inputs.release_state }}-upgrade-qualification
          path: windows/installer/artifacts/release-upgrade-qualification/
          if-no-files-found: error
